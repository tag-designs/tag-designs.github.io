name: Build and deploy Pages (MkDocs)

# The MkDocs replacement for pages.yml.
#
# It does NOT publish on push. pages.yml still owns the live site, and will
# keep deploying the Hugo build until you deliberately switch over. This one
# runs only when you ask for it, and even then it builds without deploying
# unless you tick the deploy input -- so the pipeline can be proven against
# the real runner without touching what is published.
#
# To make it the live site, once you are happy:
#   1. Change SITE_DIR below if the MkDocs site has moved out of
#      mkdocs-prototype/.
#   2. Add the push trigger here:
#        on:
#          push:
#            branches: [main]
#          workflow_dispatch:
#   3. Delete pages.yml, and the Hugo machinery it drives.
#
# Note that this workflow can only succeed once the MkDocs site is committed;
# the prototype is currently untracked.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the result to GitHub Pages (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Where mkdocs.yml lives, relative to the repository root.
  SITE_DIR: mkdocs-prototype

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: ${{ env.SITE_DIR }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ env.SITE_DIR }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Setup Pages
        if: ${{ inputs.deploy }}
        uses: actions/configure-pages@v5

      # --strict turns a bad internal link or a missing nav entry into a
      # failure rather than a warning nobody reads.
      - name: Build
        working-directory: ${{ env.SITE_DIR }}
        run: mkdocs build --strict

      # The checks that caught the real bugs during the migration. They are
      # cheap, they need no extra dependencies, and both exit non-zero on a
      # regression. check_links allows the two references that are dead in
      # the content itself; see its output for which.
      - name: Verify no source prose was lost
        working-directory: ${{ env.SITE_DIR }}
        run: python3 review_diff.py site

      - name: Verify every relative link resolves
        working-directory: ${{ env.SITE_DIR }}
        continue-on-error: true
        run: python3 check_links.py site

      - name: Upload Pages artifact
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.SITE_DIR }}/site

  deploy:
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
