name: Build and deploy Pages

# Builds the MkDocs Material site at the repository root and publishes it to
# GitHub Pages. Replaced the Hugo/Docsy pipeline, which needed Go, Hugo
# Extended, Node and a PostCSS toolchain to do the same job.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the result (a manual run builds only by default)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A push to main always publishes; a manual run only if asked.
      PUBLISH: ${{ github.event_name == 'push' || inputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Setup Pages
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/configure-pages@v5

      # --strict turns a bad internal link or a page missing from nav into a
      # failure rather than a warning nobody reads.
      - name: Build
        run: mkdocs build --strict

      # Every relative reference resolves, so a new broken one fails the
      # build rather than being reported and ignored.
      - name: Check that relative links resolve
        run: python3 check_links.py site

      - name: Upload Pages artifact
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
